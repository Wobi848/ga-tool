<!doctype html>
<html lang="de" data-theme="auto">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1b1d1f" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="GA Tool" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script nonce="%sveltekit.nonce%">
			// Runs before first paint — prevents theme flicker
			(function () {
				try {
					var t = localStorage.getItem('ga-theme');
					if (t === 'light' || t === 'dark' || t === 'oled' || t === 'auto') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		<!-- Schriften kommen aus dem eigenen Haus, siehe layout.css. Vorgeladen
		     wird nur der latin-Schnitt: der deckt den Alltag ab, latin-ext holt
		     der Browser nur, wenn ein Zeichen daraus vorkommt. -->
		<link
			rel="preload"
			href="/fonts/archivo-variabel-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/plex-mono-500-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
